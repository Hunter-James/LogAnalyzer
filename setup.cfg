; Конфиг для линтеров/форматтеров. Команда придерживается PEP 8 со
; стандартной для команды длиной строки 120 (PEP 8 явно разрешает
; "team consensus" до 99-120 chars).

[pycodestyle]
max-line-length = 120
exclude = build,dist,.venv,.git,.claude

[flake8]
max-line-length = 120
exclude = build,dist,.venv,.git,.claude
; help_dialog.py содержит большой HTML-литерал внутри тройных кавычек -
; разбивка длинных строк в Python превратит читаемый HTML в лестницу,
; пользы PEP 8 на читаемость HTML не распространяется.
per-file-ignores =
    src/gui/help_dialog.py:E501
    src/main.py:E402

[autopep8]
max_line_length = 120
aggressive = 2
